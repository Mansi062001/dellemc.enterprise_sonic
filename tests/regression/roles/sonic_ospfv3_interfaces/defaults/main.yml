            authentication_algorithm: 'MD5'
            authentication_key: "{{ sonic_ospfv3_interfaces_test_vars_keys.l5 }}"
            authentication_key_encrypted: true
            spi_value: 700
        network: broadcast
      - name: "{{ sonic_ospfv3_interfaces_test_vars.lo1 }}"
        network: point_to_point

  - name: test_case_04

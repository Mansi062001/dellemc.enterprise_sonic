sonic_ospfv3_interfaces_preparations_tests:
  lag_interfaces:
    - name: "{{ sonic_ospfv3_interfaces_test_vars.po1 }}"
    - name: "{{ sonic_ospfv3_interfaces_test_vars.po2 }}"
  vlans:
    - vlan_id: 100
    - vlan_id: 101
  init_loopback:
    - "interface {{ sonic_ospfv3_interfaces_test_vars.lo1 }}"
  init_ospf:
    - router ospfv3
  delete_ospf:
    - no router ospfv3

sonic_ospfv3_interfaces_tests:

  - name: test_case_01
    description: Add OSPFv3 interface configurations for Ethernet interfaces
    state: merged
    input:
      - name: "{{ interface7 }}"
        area_id: 2.2.2.2
        cost: 20
        priority: 20
        hello_interval: 10
        dead_interval: 40
        mtu_ignore: true
        bfd:
          enable: true
          bfd_profile: 'profile1'
        network: broadcast
        ospfv3ipsec:
          authentication:
            authentication_algorithm: 'SHA1'
            authentication_key: "{{ sonic_ospfv3_interfaces_test_vars_keys.l1 }}"
            authentication_key_encrypted: true
            authentication_type: 'IPSEC'
            spi_value: 958
      - name: "{{ interface8 }}"
        area_id: '3.3.3.3'
        bfd:
          enable: true
        network: point_to_point
      - name: "{{ interface9 }}"
        bfd:
          enable: true
          bfd_profile: 'profile1'
        ospfv3ipsec:
          encryption:
            spi_value: 493
            encryption_type: 'IPSEC'
            encryption_algorithm: 'AES_CBC_128'
            encryption_key:  "{{ sonic_ospfv3_interfaces_test_vars_keys.l2 }}"
            authentication_algorithm: 'MD5'
            authentication_key: "{{ sonic_ospfv3_interfaces_test_vars_keys.l3 }}"
            authentication_key_encrypted: true

  - name: test_case_02
    description: Add OSPFv3 interface configurations for Lag interfaces
    state: merged
    input:
      - name: "{{ sonic_ospfv3_interfaces_test_vars.po1 }}"
        area_id: 4.4.4.4
        cost: 20
        priority: 15
        retransmit_interval: 100
        transmit_delay: 20
        network: broadcast
        bfd:
          enable: true
          bfd_profile: 'profile1'
        ospfv3ipsec:
          encryption:
            spi_value: 491
            encryption_type: 'IPSEC'
            encryption_algorithm: 'NULL'
            authentication_algorithm: 'SHA256'
            authentication_key: "{{ sonic_ospfv3_interfaces_test_vars_keys.l4 }}"
            authentication_key_encrypted: true
      - name: "{{ sonic_ospfv3_interfaces_test_vars.po2 }}"
        area_id: '3.3.3.3'

  - name: test_case_03
    description: Add OSPFv3 interface configurations for Vlan and Loopback interfaces
